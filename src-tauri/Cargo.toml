[package]
name = "tools"
version = "0.1.0"
description = "PDF, image, video and IT tools that run entirely on your device"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
# The Android build loads the app as a shared library; desktop links it in.
name = "tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
local-ip-address = "0.6.13"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
spake2 = "0.4.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies]
# For the Wi-Fi multicast lock local share needs (src/android.rs).
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri's webview uses; only for turning on camera and WebRTC.
webkit2gtk = { version = "2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
