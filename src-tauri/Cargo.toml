[package]
name = "tools"
version = "0.1.0"
description = "PDF, image, video and IT tools that run entirely on your device"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
# The Android build loads the app as a shared library; desktop links it in.
name = "tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
